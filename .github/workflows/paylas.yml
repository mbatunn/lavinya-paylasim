name: Story paylaş

on:
  schedule:
    - cron: '*/10 7-13 * * *' # her 10 dakikada, Türkiye saatiyle 10:00-16:50 arası (UTC+3)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paylas
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Zamanı gelen story'leri paylaş
        run: node paylas.js
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Paylaşılanları takvime işle
        if: always()
        run: |
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add takvim.json
          git diff --cached --quiet || (git commit -m "Paylaşılan story'ler işaretlendi" && git push)
